<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080807">
  <meta name="robots" content="noindex">
  <title>Página não encontrada | Imperium Barber</title>
  <link rel="icon" type="image/svg+xml" href="images/imperium-favicon.svg">
  <style>
    :root {
      color-scheme: dark;
      font-family: "DM Sans", Arial, sans-serif;
      background: #080807;
      color: #f3f0e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0, #1a160c 0, transparent 430px), #080807;
      text-align: center;
    }

    main {
      width: min(100%, 440px);
      padding: 36px 26px;
      border: 1px solid #292924;
      border-radius: 16px;
      background: #11110f;
      box-shadow: 0 20px 70px #0007;
    }

    img {
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
      border: 1px solid #514324;
      border-radius: 10px;
      object-fit: contain;
    }

    p {
      margin: 0;
      color: #b8a06a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: clamp(24px, 7vw, 32px);
    }

    .message {
      margin: 0 0 24px;
      color: #aaa99f;
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.7;
    }

    a {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid #dcaf24;
      border-radius: 8px;
      background: #dfb323;
      color: #18150a;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      transition: background .2s;
    }

    a:hover {
      background: #f0c943;
    }

    a:focus-visible {
      outline: 2px solid #f0cb52;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <img src="cliente/images/logo-imperium.png" alt="Imperium Barber">
    <p>IMPERIUM BARBER</p>
    <h1>Página não encontrada</h1>
    <p class="message">Esse endereço não existe ou foi alterado. Volte ao agendamento para encontrar seu próximo horário.</p>
    <a href="cliente/">Ir para o agendamento</a>
  </main>
</body>
</html>
